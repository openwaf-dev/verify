version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/node", "/react", "/vue"]
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
    # Major versions of the toolchain (TypeScript, jsdom, @types/node) change supported Node versions and output:
    # they are upgraded by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
