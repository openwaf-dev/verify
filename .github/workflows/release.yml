name: release

# A tag vX.Y.Z publishes a GitHub release with the npm tarballs of @openwaf/verify, @openwaf/verify-react and
# @openwaf/verify-vue (install them by URL until the packages are on the npm registry) and their SHA256SUMS. Go
# (go get …@vX.Y.Z) and Composer (VCS repository) read the tag itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for p in node react vue; do
            v=$(node -p "require('./$p/package.json').version")
            test "v$v" = "$TAG" || { echo "$p/package.json is $v, tag is $TAG" >&2; exit 1; }
          done
          grep -q "^## \[${TAG#v}\]" CHANGELOG.md || { echo "CHANGELOG.md has no ${TAG#v} section" >&2; exit 1; }
      - name: Pack
        run: |
          mkdir dist
          for p in node react vue; do
            (cd "$p" && npm ci && npm pack --pack-destination ../dist)
          done
          (cd dist && sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: awk -v v="${TAG#v}" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tgz dist/SHA256SUMS --title "$TAG" --notes-file notes.md --verify-tag
