name: php

on:
  push:
    branches: [main]
    paths:
      - "composer.json"
      - "php/**"
      - "examples/php/**"
      - ".github/workflows/php.yml"
  pull_request:
    paths:
      - "composer.json"
      - "php/**"
      - "examples/php/**"
      - ".github/workflows/php.yml"

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.extensions == 'none' && 'streams' || 'curl' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        extensions: ["curl"]
        include:
          - php: "8.4"
            extensions: "none"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions == 'none' && ':curl' || 'curl' }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php -l examples/php/index.php
      - run: vendor/bin/phpunit -c php/phpunit.xml.dist
